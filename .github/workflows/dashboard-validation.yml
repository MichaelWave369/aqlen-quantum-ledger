name: Dashboard validation

on:
  push:
    paths:
      - "dashboard/**"
      - "tools/validate_dashboard_*.py"
      - "examples/graph_renderer_v0_6_ci_validation_commands.json"
      - "docs/DASHBOARD_VALIDATION_v0_6_CI_NEGATIVE_FIXTURES.md"
  pull_request:
    paths:
      - "dashboard/**"
      - "tools/validate_dashboard_*.py"
      - "examples/graph_renderer_v0_6_ci_validation_commands.json"
      - "docs/DASHBOARD_VALIDATION_v0_6_CI_NEGATIVE_FIXTURES.md"

jobs:
  validate-dashboard-payloads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dashboard fixture suite
        run: python tools/validate_dashboard_fixture_suite.py
